name: CI

on:
  push:
    branches: [master]
  pull_request: {}
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_channel:
        description: Prerelease channel to create, or none for a manual package build
        type: choice
        required: true
        default: none
        options:
          - none
          - alpha
          - beta
          - rc
      dry_run:
        description: Validate the selected release without publishing packages or creating a release
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'release' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CONFIGURATION: Release
  ARTIFACTS_PATH: ./artifacts
  MinVerDefaultPreReleaseIdentifiers: preview

jobs:
  prepare-version:
    name: Prepare version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.prerelease-version.outputs.version }}
      smoke-cache-key-suffix: ${{ steps.smoke-cache-key.outputs.suffix }}

    steps:
      - name: Checkout
        if: github.event_name == 'workflow_dispatch' && inputs.release_channel != 'none'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine prerelease version
        if: github.event_name == 'workflow_dispatch' && inputs.release_channel != 'none'
        id: prerelease-version
        env:
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        shell: bash
        run: |
          set -euo pipefail

          minimum_major_minor=$(sed -n 's:.*<MinVerMinimumMajorMinor>\([^<]*\)</MinVerMinimumMajorMinor>.*:\1:p' eng/Package.props | head -n 1)

          if [[ ! "$minimum_major_minor" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Could not determine MinVerMinimumMajorMinor from eng/Package.props."
            exit 1
          fi

          minimum_version="${minimum_major_minor}.0"
          latest_stable_tag=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)

          if [ -z "$latest_stable_tag" ]; then
            release_base="$minimum_version"
          else
            latest_stable_version="${latest_stable_tag#v}"
            IFS=. read -r stable_major stable_minor _ <<< "$latest_stable_version"
            auto_incremented_version="${stable_major}.$((stable_minor + 1)).0"

            release_base=$(printf '%s\n%s\n' "$minimum_version" "$auto_incremented_version" | sort -V | tail -n 1)
          fi

          latest_channel_tag=$(git tag -l "v${release_base}-${RELEASE_CHANNEL}.*" --sort=-version:refname | head -n 1 || true)

          if [ -z "$latest_channel_tag" ]; then
            channel_number=1
          else
            channel_number="${latest_channel_tag##*.}"

            if [[ ! "$channel_number" =~ ^[0-9]+$ ]]; then
              echo "Could not determine prerelease number from $latest_channel_tag."
              exit 1
            fi

            channel_number=$((channel_number + 1))
          fi

          version="${release_base}-${RELEASE_CHANNEL}.${channel_number}"
          echo "Selected prerelease version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Determine smoke cache key
        id: smoke-cache-key
        env:
          PRERELEASE_VERSION: ${{ steps.prerelease-version.outputs.version }}
        shell: bash
        run: |
          if [ -n "$PRERELEASE_VERSION" ]; then
            suffix="$PRERELEASE_VERSION"
          else
            suffix="default"
          fi

          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"

  validate-and-pack:
    name: Validate and pack
    needs: prepare-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MinVerVersionOverride: ${{ needs.prepare-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration $CONFIGURATION --no-restore --warnaserror

      - name: Test
        run: dotnet test --configuration $CONFIGURATION --no-build --logger GitHubActions

      - name: Pack
        run: dotnet pack --configuration $CONFIGURATION --no-build --output $ARTIFACTS_PATH/packages

      - name: Upload packages
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ${{ env.ARTIFACTS_PATH }}/packages/*.nupkg
            ${{ env.ARTIFACTS_PATH }}/packages/*.snupkg
          if-no-files-found: error

  smoke-pack:
    name: Pack for template smoke tests
    needs: prepare-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MinVerVersionOverride: ${{ needs.prepare-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration $CONFIGURATION --no-restore --warnaserror

      - name: Pack locally
        run: dotnet pack --configuration $CONFIGURATION --no-build --output $ARTIFACTS_PATH/packages

      - name: Verify package versions
        shell: bash
        run: |
          set -euo pipefail

          versions_file=$(mktemp)

          for package in "$ARTIFACTS_PATH"/packages/Kralizek.Lambda.*.nupkg; do
            nuspec=$(unzip -p "$package" '*.nuspec')
            package_id=$(printf '%s\n' "$nuspec" | sed -n 's:.*<id>\(.*\)</id>.*:\1:p' | head -n 1)
            package_version=$(printf '%s\n' "$nuspec" | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' | head -n 1)

            if [ -z "$package_id" ] || [ -z "$package_version" ]; then
              echo "Could not read package metadata from $package"
              exit 1
            fi

            printf '%-45s %s\n' "$package_id" "$package_version"
            echo "$package_version" >> "$versions_file"
          done

          package_versions=$(sort -u "$versions_file")
          version_count=$(printf '%s\n' "$package_versions" | sed '/^$/d' | wc -l)

          if [ "$version_count" -ne 1 ]; then
            echo "Packed projects do not share the same package version:"
            printf '%s\n' "$package_versions"
            exit 1
          fi

          package_version=$(printf '%s\n' "$package_versions" | head -n 1)
          echo "$package_version" > "$ARTIFACTS_PATH/packages/package-version.txt"

      - name: Cache smoke-test packages
        uses: actions/cache@v4
        with:
          path: ${{ env.ARTIFACTS_PATH }}/packages
          key: smoke-packages-${{ runner.os }}-${{ github.sha }}-${{ github.event_name }}-${{ needs.prepare-version.outputs.smoke-cache-key-suffix }}

  template-smoke-test:
    name: Template smoke test (${{ matrix.name }})
    needs: [prepare-version, smoke-pack]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Event
            short-name: lambda-template-event
            project-name: SmokeEvent
            raw: false
            otel: false
          - name: Event (OpenTelemetry)
            short-name: lambda-template-event
            project-name: SmokeEventOtel
            raw: false
            otel: true
          - name: Request
            short-name: lambda-template-request
            project-name: SmokeRequest
            raw: false
            otel: false
          - name: Request (OpenTelemetry)
            short-name: lambda-template-request
            project-name: SmokeRequestOtel
            raw: false
            otel: true
          - name: EventBridge
            short-name: lambda-template-eventbridge
            project-name: SmokeEventBridge
            raw: false
            otel: false
          - name: DynamoDB Streams
            short-name: lambda-template-dynamodb-stream
            project-name: SmokeDynamoDbStream
            raw: false
            otel: false
          - name: Kinesis Streams
            short-name: lambda-template-kinesis-stream
            project-name: SmokeKinesisStream
            raw: false
            otel: false
          - name: Kinesis Streams (raw)
            short-name: lambda-template-kinesis-stream
            project-name: SmokeKinesisStreamRaw
            args: --raw
            raw: true
            otel: false
          - name: S3
            short-name: lambda-template-s3
            project-name: SmokeS3
            raw: false
            otel: false
          - name: S3 Batch
            short-name: lambda-template-s3-batch
            project-name: SmokeS3Batch
            raw: false
            otel: false
          - name: SNS
            short-name: lambda-template-sns
            project-name: SmokeSns
            raw: false
            otel: false
          - name: SNS (raw)
            short-name: lambda-template-sns
            project-name: SmokeSnsRaw
            args: --raw
            raw: true
            otel: false
          - name: SQS
            short-name: lambda-template-sqs
            project-name: SmokeSqs
            raw: false
            otel: false
          - name: SQS (raw)
            short-name: lambda-template-sqs
            project-name: SmokeSqsRaw
            args: --raw
            raw: true
            otel: false
          - name: Cognito Pre Sign-up
            short-name: lambda-template-cognito-pre-signup
            project-name: SmokeCognitoPreSignUp
            raw: false
            otel: false
          - name: Cognito Post Confirmation
            short-name: lambda-template-cognito-post-confirmation
            project-name: SmokeCognitoPostConfirmation
            raw: false
            otel: false
          - name: Cognito Pre Authentication
            short-name: lambda-template-cognito-pre-authentication
            project-name: SmokeCognitoPreAuthentication
            raw: false
            otel: false
          - name: Cognito Post Authentication
            short-name: lambda-template-cognito-post-authentication
            project-name: SmokeCognitoPostAuthentication
            raw: false
            otel: false
          - name: Cognito Define Auth Challenge
            short-name: lambda-template-cognito-define-auth-challenge
            project-name: SmokeCognitoDefineAuthChallenge
            raw: false
            otel: false
          - name: Cognito Create Auth Challenge
            short-name: lambda-template-cognito-create-auth-challenge
            project-name: SmokeCognitoCreateAuthChallenge
            raw: false
            otel: false
          - name: Cognito Verify Auth Challenge
            short-name: lambda-template-cognito-verify-auth-challenge
            project-name: SmokeCognitoVerifyAuthChallenge
            raw: false
            otel: false
          - name: Cognito Custom Message
            short-name: lambda-template-cognito-custom-message
            project-name: SmokeCognitoCustomMessage
            raw: false
            otel: false
          - name: Cognito User Migration
            short-name: lambda-template-cognito-user-migration
            project-name: SmokeCognitoUserMigration
            raw: false
            otel: false
          - name: Cognito Custom Email Sender
            short-name: lambda-template-cognito-custom-email-sender
            project-name: SmokeCognitoCustomEmailSender
            raw: false
            otel: false
          - name: Cognito Custom SMS Sender
            short-name: lambda-template-cognito-custom-sms-sender
            project-name: SmokeCognitoCustomSmsSender
            raw: false
            otel: false
          - name: Cognito Pre Token Generation V1
            short-name: lambda-template-cognito-pre-token-generation
            project-name: SmokeCognitoPreTokenGenerationV1
            args: --version v1
            raw: false
            otel: false
          - name: Cognito Pre Token Generation V2
            short-name: lambda-template-cognito-pre-token-generation
            project-name: SmokeCognitoPreTokenGenerationV2
            args: --version v2
            raw: false
            otel: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore smoke-test packages
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ARTIFACTS_PATH }}/packages
          key: smoke-packages-${{ runner.os }}-${{ github.sha }}-${{ github.event_name }}-${{ needs.prepare-version.outputs.smoke-cache-key-suffix }}
          fail-on-cache-miss: true

      - name: Read package metadata
        shell: bash
        run: |
          echo "PACKAGE_VERSION=$(cat "$ARTIFACTS_PATH/packages/package-version.txt")" >> "$GITHUB_ENV"
          echo "TEMPLATE_PACKAGE=$(ls "$ARTIFACTS_PATH"/packages/Kralizek.Lambda.Templates.*.nupkg)" >> "$GITHUB_ENV"

      - name: Install packaged templates
        run: |
          dotnet new install "$TEMPLATE_PACKAGE"
          dotnet new list "${{ matrix.short-name }}"

      - name: Instantiate ${{ matrix.name }} template
        run: |
          mkdir -p "$RUNNER_TEMP/lambda-template-smoke"
          dotnet new "${{ matrix.short-name }}" \
            --name "${{ matrix.project-name }}" \
            --output "$RUNNER_TEMP/lambda-template-smoke/${{ matrix.project-name }}" \
            --profile SmokeProfile \
            --region eu-north-1 \
            --role SmokeRole \
            ${{ matrix.otel && '--otel' || '' }} \
            ${{ matrix.args }}

      - name: Verify generated content
        shell: bash
        run: |
          project="$RUNNER_TEMP/lambda-template-smoke/${{ matrix.project-name }}"
          grep -q 'SmokeProfile' "$project/aws-lambda-tools-defaults.json"
          grep -q 'eu-north-1' "$project/aws-lambda-tools-defaults.json"
          grep -q 'SmokeRole' "$project/aws-lambda-tools-defaults.json"
          grep -q "Version=\"$PACKAGE_VERSION\"" "$project/${{ matrix.project-name }}.csproj"
          ! grep -R -q '__KRALIZEK_LAMBDA_VERSION__' "$project"

          if [ "${{ matrix.otel }}" = "true" ]; then
            grep -q 'OpenTelemetry.Instrumentation.AWSLambda' "$project/${{ matrix.project-name }}.csproj"
            grep -q 'OpenTelemetry.Exporter.OpenTelemetryProtocol' "$project/${{ matrix.project-name }}.csproj"
            grep -q 'AWSLambdaWrapper.TraceAsync' "$project/Function.cs"
            grep -q 'ConfigureTracing' "$project/Function.cs"
            grep -q 'ConfigureMetrics' "$project/Function.cs"
          else
            ! grep -R -q 'OpenTelemetry' "$project"
          fi

          if [ "${{ matrix.raw }}" = "true" ]; then
            test ! -f "$project/OrderCreated.cs"
            test ! -f "$project/OrderCreatedHandler.cs"

            case "${{ matrix.short-name }}" in
              lambda-template-kinesis-stream)
                test -f "$project/RawKinesisStreamRecordHandler.cs"
                grep -q 'KinesisStreamFunction<RawKinesisStreamRecordHandler>' "$project/Function.cs"
                ;;
              lambda-template-sns)
                test -f "$project/RawSnsRecordHandler.cs"
                grep -q 'SnsFunction<RawSnsRecordHandler>' "$project/Function.cs"
                ;;
              lambda-template-sqs)
                test -f "$project/RawSqsRecordHandler.cs"
                grep -q 'SqsFunction<RawSqsRecordHandler>' "$project/Function.cs"
                ;;
            esac
          fi

      - name: Configure smoke-test package sources
        shell: bash
        run: |
          local_feed=$(realpath $ARTIFACTS_PATH/packages)
          cat > "$RUNNER_TEMP/lambda-template-smoke/NuGet.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$local_feed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local">
                <package pattern="Kralizek.Lambda.*" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF

      - name: Restore generated project
        run: >-
          dotnet restore
          "$RUNNER_TEMP/lambda-template-smoke/${{ matrix.project-name }}"
          --configfile "$RUNNER_TEMP/lambda-template-smoke/NuGet.config"
          --packages "$RUNNER_TEMP/lambda-template-smoke/packages"

      - name: Build generated project
        run: >-
          dotnet build
          "$RUNNER_TEMP/lambda-template-smoke/${{ matrix.project-name }}"
          --configuration $CONFIGURATION
          --no-restore
          --warnaserror

  publish:
    name: Publish
    needs: [prepare-version, validate-and-pack, template-smoke-test]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Validate manual release source
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master'
        run: |
          echo "Manual releases must be dispatched from master."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate GitHub release metadata
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag is not a supported Semantic Versioning tag: $RELEASE_TAG"
            exit 1
          fi

          release_commit=$(git rev-parse "$RELEASE_TAG^{commit}")
          head_commit=$(git rev-parse HEAD)

          if [ "$release_commit" != "$head_commit" ]; then
            echo "Release tag $RELEASE_TAG does not point to the checked-out commit."
            exit 1
          fi

          if [[ "$RELEASE_TAG" == *-* ]]; then
            if [ "$RELEASE_IS_PRERELEASE" != "true" ]; then
              echo "Prerelease tag $RELEASE_TAG must be published as a GitHub prerelease."
              exit 1
            fi
          elif [ "$RELEASE_IS_PRERELEASE" != "false" ]; then
            echo "Stable tag $RELEASE_TAG must not be published as a GitHub prerelease."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts/packages

      - name: Read release metadata
        shell: bash
        run: |
          set -euo pipefail

          package=$(ls ./artifacts/packages/Kralizek.Lambda.Templates.*.nupkg)
          nuspec=$(unzip -p "$package" '*.nuspec')
          package_version=$(printf '%s\n' "$nuspec" | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' | head -n 1)

          if [ -z "$package_version" ]; then
            echo "Could not determine the package version."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_tag="v$package_version"

            if [ "${{ inputs.release_channel }}" != "none" ] && [ "$package_version" != "${{ needs.prepare-version.outputs.version }}" ]; then
              echo "Packed version $package_version does not match selected prerelease version ${{ needs.prepare-version.outputs.version }}."
              exit 1
            fi
          else
            release_tag="${{ github.event.release.tag_name }}"
            tag_version="${release_tag#v}"

            if [ "$tag_version" != "$package_version" ]; then
              echo "Release tag version $tag_version does not match packed version $package_version."
              exit 1
            fi
          fi

          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Dry-run release summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        shell: bash
        run: |
          echo "Dry run: no packages or GitHub release will be published."
          echo "Release channel: ${{ inputs.release_channel }}"
          echo "Package version: $PACKAGE_VERSION"
          if [ "${{ inputs.release_channel }}" = "alpha" ]; then
            echo "Production release would publish to GitHub Packages and create a GitHub prerelease."
          elif [ "${{ inputs.release_channel }}" = "beta" ] || [ "${{ inputs.release_channel }}" = "rc" ]; then
            echo "Production release would publish to GitHub Packages and NuGet.org and create a GitHub prerelease."
          else
            echo "Production run would publish the package to GitHub Packages only."
          fi

      - name: Configure GitHub Packages source
        if: github.event_name == 'release' || !inputs.dry_run
        run: >-
          dotnet nuget add source
          "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --name github
          --username "${{ github.actor }}"
          --password "${{ github.token }}"
          --store-password-in-clear-text

      - name: Publish to GitHub Packages
        if: github.event_name == 'release' || !inputs.dry_run
        run: >-
          dotnet nuget push
          "./artifacts/packages/*.nupkg"
          --source github
          --api-key "${{ github.token }}"
          --skip-duplicate

      # Alpha releases stay on GitHub for explicit/manual consumption.
      # Beta, RC, and stable releases are also published to NuGet.org.
      - name: Log in to NuGet.org
        if: >-
          (github.event_name == 'release' && !contains(github.event.release.tag_name, '-alpha.')) ||
          (github.event_name == 'workflow_dispatch' && (inputs.release_channel == 'beta' || inputs.release_channel == 'rc'))
        id: nuget-login
        uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: Kralizek

      - name: Publish to NuGet.org
        if: >-
          (github.event_name == 'release' && !contains(github.event.release.tag_name, '-alpha.')) ||
          (github.event_name == 'workflow_dispatch' && !inputs.dry_run && (inputs.release_channel == 'beta' || inputs.release_channel == 'rc'))
        run: >-
          dotnet nuget push
          "./artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Ensure GitHub prerelease exists
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.release_channel != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --prerelease

      - name: Attach packages to the GitHub release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.release_channel != 'none')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$RELEASE_TAG"
          ./artifacts/packages/*.nupkg
          ./artifacts/packages/*.snupkg
          --repo "${{ github.repository }}"
          --clobber