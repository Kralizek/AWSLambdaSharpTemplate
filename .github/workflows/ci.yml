name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'benchmarks/**'
  pull_request:
    paths-ignore:
      - 'benchmarks/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_channel:
        description: Prerelease channel to create, or none for a manual package build
        type: choice
        required: true
        default: none
        options:
          - none
          - alpha
          - beta
          - rc
      dry_run:
        description: Validate the selected release without publishing packages or creating a release
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'release' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CONFIGURATION: Release
  ARTIFACTS_PATH: ./artifacts
  MinVerDefaultPreReleaseIdentifiers: preview

jobs:
  prepare-version:
    name: Prepare version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.prerelease-version.outputs.version }}
      smoke-cache-key-suffix: ${{ steps.smoke-cache-key.outputs.suffix }}

    steps:
      - name: Checkout
        if: github.event_name == 'workflow_dispatch' && inputs.release_channel != 'none'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine prerelease version
        if: github.event_name == 'workflow_dispatch' && inputs.release_channel != 'none'
        id: prerelease-version
        env:
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        shell: bash
        run: |
          set -euo pipefail

          minimum_major_minor=$(sed -n 's:.*<MinVerMinimumMajorMinor>\([^<]*\)</MinVerMinimumMajorMinor>.*:\1:p' eng/Package.props | head -n 1)

          if [[ ! "$minimum_major_minor" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Could not determine MinVerMinimumMajorMinor from eng/Package.props."
            exit 1
          fi

          minimum_version="${minimum_major_minor}.0"
          latest_stable_tag=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)

          if [ -z "$latest_stable_tag" ]; then
            release_base="$minimum_version"
          else
            latest_stable_version="${latest_stable_tag#v}"
            IFS=. read -r stable_major stable_minor _ <<< "$latest_stable_version"
            auto_incremented_version="${stable_major}.$((stable_minor + 1)).0"

            release_base=$(printf '%s\n%s\n' "$minimum_version" "$auto_incremented_version" | sort -V | tail -n 1)
          fi

          latest_channel_tag=$(git tag -l "v${release_base}-${RELEASE_CHANNEL}.*" --sort=-version:refname | head -n 1 || true)

          if [ -z "$latest_channel_tag" ]; then
            channel_number=1
          else
            channel_number="${latest_channel_tag##*.}"

            if [[ ! "$channel_number" =~ ^[0-9]+$ ]]; then
              echo "Could not determine prerelease number from $latest_channel_tag."
              exit 1
            fi

            channel_number=$((channel_number + 1))
          fi

          version="${release_base}-${RELEASE_CHANNEL}.${channel_number}"
          echo "Selected prerelease version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Determine smoke cache key
        id: smoke-cache-key
        env:
          PRERELEASE_VERSION: ${{ steps.prerelease-version.outputs.version }}
        shell: bash
        run: |
          if [ -n "$PRERELEASE_VERSION" ]; then
            suffix="$PRERELEASE_VERSION"
          else
            suffix="default"
          fi

          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"

  validate-and-pack:
    name: Validate and pack
    needs: prepare-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MinVerVersionOverride: ${{ needs.prepare-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration $CONFIGURATION --no-restore --warnaserror

      - name: Test
        run: dotnet test --configuration $CONFIGURATION --no-build --logger GitHubActions

      - name: Pack
        run: dotnet pack --configuration $CONFIGURATION --no-build --output $ARTIFACTS_PATH/packages

      - name: Upload packages
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ${{ env.ARTIFACTS_PATH }}/packages/*.nupkg
            ${{ env.ARTIFACTS_PATH }}/packages/*.snupkg
          if-no-files-found: error

  smoke-pack:
    name: Pack for template smoke tests
    needs: prepare-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MinVerVersionOverride: ${{ needs.prepare-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration $CONFIGURATION --no-restore --warnaserror

      - name: Pack locally
        run: dotnet pack --configuration $CONFIGURATION --no-build --output $ARTIFACTS_PATH/packages

      - name: Verify package versions
        shell: bash
        run: |
          set -euo pipefail

          versions_file=$(mktemp)

          for package in "$ARTIFACTS_PATH"/packages/Kralizek.Lambda.*.nupkg; do
            nuspec=$(unzip -p "$package" '*.nuspec')
            package_id=$(printf '%s\n' "$nuspec" | sed -n 's:.*<id>\(.*\)</id>.*:\1:p' | head -n 1)
            package_version=$(printf '%s\n' "$nuspec" | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' | head -n 1)

            if [ -z "$package_id" ] || [ -z "$package_version" ]; then
              echo "Could not read package metadata from $package"
              exit 1
            fi

            printf '%-45s %s\n' "$package_id" "$package_version"
            echo "$package_version" >> "$versions_file"
          done

          package_versions=$(sort -u "$versions_file")
          version_count=$(printf '%s\n' "$package_versions" | sed '/^$/d' | wc -l)

          if [ "$version_count" -ne 1 ]; then
            echo "Packed projects do not share the same package version:"
            printf '%s\n' "$package_versions"
            exit 1
          fi

          package_version=$(printf '%s\n' "$package_versions" | head -n 1)
          echo "$package_version" > "$ARTIFACTS_PATH/packages/package-version.txt"

      - name: Cache smoke-test packages
        uses: actions/cache@v4
        with:
          path: ${{ env.ARTIFACTS_PATH }}/packages
          key: smoke-packages-${{ runner.os }}-${{ github.sha }}-${{ github.event_name }}-${{ needs.prepare-version.outputs.smoke-cache-key-suffix }}

  prepare-template-smoke-tests:
    name: Prepare template smoke tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine template smoke-test mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              mode=pr
              ;;
            push)
              if [ "$REF" != "refs/heads/master" ]; then
                echo "Template smoke tests only support pushes to master."
                exit 1
              fi

              mode=master
              ;;
            release|workflow_dispatch)
              mode=release
              ;;
            *)
              echo "Unsupported template smoke-test event: $EVENT_NAME"
              exit 1
              ;;
          esac

          echo "Selected template smoke-test mode: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Read template smoke-test matrix
        shell: bash
        run: jq -c . .github/template-smoke-tests.json > "$RUNNER_TEMP/template-smoke-tests.source.json"

      - name: Validate template smoke-test matrix
        run: >-
          npx --yes ajv-cli@5.0.0 validate
          --spec=draft7
          --all-errors
          -s .github/template-smoke-tests.schema.json
          -d "$RUNNER_TEMP/template-smoke-tests.source.json"

      - name: Filter template smoke-test matrix
        env:
          SMOKE_TEST_MODE: ${{ steps.mode.outputs.mode }}
        shell: bash
        run: >-
          jq -ce --arg mode "$SMOKE_TEST_MODE"
          '{include: [.include[] | select(.when | index($mode))]}
          | if (.include | length) > 0 then . else error("No template smoke tests selected for mode: " + $mode) end'
          "$RUNNER_TEMP/template-smoke-tests.source.json"
          > "$RUNNER_TEMP/template-smoke-tests.json"

      - name: Export template smoke-test matrix
        id: matrix
        shell: bash
        run: echo "matrix=$(cat "$RUNNER_TEMP/template-smoke-tests.json")" >> "$GITHUB_OUTPUT"

  prepare-native-aot-samples:
    name: Prepare Native AOT samples
    needs: prepare-template-smoke-tests
    if: needs.prepare-template-smoke-tests.outputs.mode != 'pr'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Discover Native AOT samples
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY' > "$RUNNER_TEMP/native-aot-samples.json"
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          samples = []

          for project in sorted(Path("samples").glob("**/*.csproj")):
              root = ET.parse(project).getroot()
              publish_aot = any(
                  element.text is not None and element.text.strip().lower() == "true"
                  for element in root.iter()
                  if element.tag.endswith("PublishAot")
              )

              if publish_aot:
                  samples.append(
                      {
                          "projectName": project.stem,
                          "projectPath": project.as_posix(),
                      }
                  )

          if not samples:
              raise SystemExit("No Native AOT sample projects found under samples/**/*.csproj with <PublishAot>true</PublishAot>.")

          print(json.dumps({"include": samples}, separators=(",", ":")))
          PY

          echo "Discovered Native AOT samples:"
          cat "$RUNNER_TEMP/native-aot-samples.json"
          echo "matrix=$(cat "$RUNNER_TEMP/native-aot-samples.json")" >> "$GITHUB_OUTPUT"

  template-smoke-test:
    name: Template smoke test (${{ matrix.name }})
    needs: [prepare-version, smoke-pack, prepare-template-smoke-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-template-smoke-tests.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore smoke-test packages
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ARTIFACTS_PATH }}/packages
          key: smoke-packages-${{ runner.os }}-${{ github.sha }}-${{ github.event_name }}-${{ needs.prepare-version.outputs.smoke-cache-key-suffix }}
          fail-on-cache-miss: true

      - name: Read package metadata
        shell: bash
        run: |
          echo "PACKAGE_VERSION=$(cat "$ARTIFACTS_PATH/packages/package-version.txt")" >> "$GITHUB_ENV"
          echo "TEMPLATE_PACKAGE=$(ls "$ARTIFACTS_PATH"/packages/Kralizek.Lambda.Templates.*.nupkg)" >> "$GITHUB_ENV"

      - name: Install packaged templates
        run: |
          dotnet new install "$TEMPLATE_PACKAGE"
          dotnet new list "${{ matrix.shortName }}"

      - name: Instantiate ${{ matrix.name }} template
        env:
          TEMPLATE_AOT: ${{ matrix.aot || false }}
          TEMPLATE_OTEL: ${{ matrix.otel || false }}
          TEMPLATE_RAW: ${{ matrix.raw || false }}
          TEMPLATE_VERSION: ${{ matrix.version || '' }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/lambda-template-smoke"

          args=()
          if [ "$TEMPLATE_AOT" = "true" ]; then
            args+=(--aot)
          fi
          if [ "$TEMPLATE_OTEL" = "true" ]; then
            args+=(--otel)
          fi
          if [ "$TEMPLATE_RAW" = "true" ]; then
            args+=(--raw)
          fi
          if [ -n "$TEMPLATE_VERSION" ]; then
            args+=(--version "$TEMPLATE_VERSION")
          fi

          dotnet new "${{ matrix.shortName }}" \
            --name "${{ matrix.projectName }}" \
            --output "$RUNNER_TEMP/lambda-template-smoke/${{ matrix.projectName }}" \
            --profile SmokeProfile \
            --region eu-north-1 \
            --role SmokeRole \
            "${args[@]}"

      - name: Verify generated content
        env:
          MUST_EXIST: ${{ toJSON(matrix.mustExist) }}
          MUST_NOT_EXIST: ${{ toJSON(matrix.mustNotExist) }}
          MUST_MATCH: ${{ toJSON(matrix.mustMatch) }}
          MUST_NOT_MATCH: ${{ toJSON(matrix.mustNotMatch) }}
        shell: bash
        run: |
          set -euo pipefail

          project="$RUNNER_TEMP/lambda-template-smoke/${{ matrix.projectName }}"
          grep -q 'SmokeProfile' "$project/aws-lambda-tools-defaults.json"
          grep -q 'eu-north-1' "$project/aws-lambda-tools-defaults.json"
          grep -q 'SmokeRole' "$project/aws-lambda-tools-defaults.json"
          grep -q "Version=\"$PACKAGE_VERSION\"" "$project/${{ matrix.projectName }}.csproj"
          ! grep -R -q '__KRALIZEK_LAMBDA_VERSION__' "$project"

          while IFS= read -r file; do
            [ -z "$file" ] || test -e "$project/$file"
          done < <(jq -r '.[]?' <<< "$MUST_EXIST")

          while IFS= read -r file; do
            [ -z "$file" ] || test ! -e "$project/$file"
          done < <(jq -r '.[]?' <<< "$MUST_NOT_EXIST")

          while IFS=$'\t' read -r file pattern; do
            [ -z "$file" ] || grep -q -- "$pattern" "$project/$file"
          done < <(jq -r '.[]? | [.file, .pattern] | @tsv' <<< "$MUST_MATCH")

          while IFS=$'\t' read -r file pattern; do
            [ -z "$file" ] || ! grep -q -- "$pattern" "$project/$file"
          done < <(jq -r '.[]? | [.file, .pattern] | @tsv' <<< "$MUST_NOT_MATCH")

      - name: Configure smoke-test package sources
        shell: bash
        run: |
          set -euo pipefail

          project="$RUNNER_TEMP/lambda-template-smoke/${{ matrix.projectName }}"
          cat > "$project/NuGet.Config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$GITHUB_WORKSPACE/$ARTIFACTS_PATH/packages" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
          </configuration>
          EOF

      - name: Restore generated project
        run: dotnet restore "$RUNNER_TEMP/lambda-template-smoke/${{ matrix.projectName }}"

      - name: Restore Native AOT runtime assets
        if: matrix.aot == true
        env:
          PROJECT_PATH: ${{ runner.temp }}/lambda-template-smoke/${{ matrix.projectName }}/${{ matrix.projectName }}.csproj
          EXPECTED_RID: ${{ matrix.runtimeIdentifier || 'linux-x64' }}
        shell: bash
        run: |
          set -euo pipefail

          project_rid=$(dotnet msbuild "$PROJECT_PATH" -nologo -getProperty:RuntimeIdentifier)

          if [ "$project_rid" != "$EXPECTED_RID" ]; then
            echo "Expected RuntimeIdentifier '$EXPECTED_RID' but generated project resolved '$project_rid'."
            exit 1
          fi

          dotnet restore "$PROJECT_PATH" --runtime "$project_rid"

      - name: Build generated project
        run: dotnet build "$RUNNER_TEMP/lambda-template-smoke/${{ matrix.projectName }}" --configuration $CONFIGURATION --no-restore --warnaserror

      - name: Publish Native AOT generated project
        if: matrix.aot == true
        env:
          PROJECT_PATH: ${{ runner.temp }}/lambda-template-smoke/${{ matrix.projectName }}/${{ matrix.projectName }}.csproj
        shell: bash
        run: |
          set -euo pipefail

          project_rid=$(dotnet msbuild "$PROJECT_PATH" -nologo -getProperty:RuntimeIdentifier)

          if [ -z "$project_rid" ]; then
            echo "Native AOT smoke test project does not define RuntimeIdentifier."
            exit 1
          fi

          dotnet publish "$PROJECT_PATH" \
            --configuration "$CONFIGURATION" \
            --runtime "$project_rid" \
            --no-restore \
            --warnaserror

  native-aot-samples:
    name: Native AOT sample (${{ matrix.projectName }})
    needs: prepare-native-aot-samples
    if: needs.prepare-native-aot-samples.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-native-aot-samples.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ matrix.projectPath }} --runtime linux-x64

      - name: Publish
        run: >-
          dotnet publish ${{ matrix.projectPath }}
          --configuration $CONFIGURATION
          --runtime linux-x64
          --no-restore
          --warnaserror

  publish:
    name: Publish
    needs: [prepare-version, validate-and-pack, template-smoke-test, native-aot-samples]
    if: >-
      always() &&
      (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_channel != 'none' && !inputs.dry_run)) &&
      needs.validate-and-pack.result == 'success' &&
      needs.template-smoke-test.result == 'success' &&
      (needs.native-aot-samples.result == 'success' || needs.native-aot-samples.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ${{ env.ARTIFACTS_PATH }}/packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Publish packages
        run: >-
          dotnet nuget push "$ARTIFACTS_PATH/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ secrets.NUGET_API_KEY }}
          --skip-duplicate
