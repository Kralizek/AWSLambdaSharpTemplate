name: OpenTelemetry template smoke tests

on:
  push:
    branches: [master]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: otel-template-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CONFIGURATION: Release
  ARTIFACTS_PATH: ./artifacts
  MinVerDefaultPreReleaseIdentifiers: preview

jobs:
  smoke-test:
    name: Event and Request with OpenTelemetry
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration $CONFIGURATION --no-restore --warnaserror

      - name: Pack locally
        run: dotnet pack --configuration $CONFIGURATION --no-build --output $ARTIFACTS_PATH/packages

      - name: Read package metadata
        shell: bash
        run: |
          template_package=$(ls "$ARTIFACTS_PATH"/packages/Kralizek.Lambda.Templates.*.nupkg)
          nuspec=$(unzip -p "$template_package" '*.nuspec')
          package_version=$(printf '%s\n' "$nuspec" | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' | head -n 1)

          echo "TEMPLATE_PACKAGE=$template_package" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Install packaged templates
        run: dotnet new install "$TEMPLATE_PACKAGE"

      - name: Generate OpenTelemetry templates
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/lambda-template-otel-smoke"
          mkdir -p "$root"

          dotnet new lambda-template-event \
            --name SmokeOtelEvent \
            --output "$root/SmokeOtelEvent" \
            --profile SmokeProfile \
            --region eu-north-1 \
            --role SmokeRole \
            --otel

          dotnet new lambda-template-request \
            --name SmokeOtelRequest \
            --output "$root/SmokeOtelRequest" \
            --profile SmokeProfile \
            --region eu-north-1 \
            --role SmokeRole \
            --otel

      - name: Verify OpenTelemetry generated content
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/lambda-template-otel-smoke"

          for project_name in SmokeOtelEvent SmokeOtelRequest; do
            project="$root/$project_name"
            grep -q 'OpenTelemetry.Instrumentation.AWSLambda' "$project/$project_name.csproj"
            grep -q 'OpenTelemetry.Exporter.OpenTelemetryProtocol' "$project/$project_name.csproj"
            grep -q 'AWSLambdaWrapper.TraceAsync' "$project/Function.cs"
            grep -q 'ConfigureTracing' "$project/Function.cs"
            grep -q 'ConfigureMetrics' "$project/Function.cs"
            grep -q "Version=\"$PACKAGE_VERSION\"" "$project/$project_name.csproj"
          done

      - name: Configure package sources
        shell: bash
        run: |
          local_feed=$(realpath "$ARTIFACTS_PATH/packages")
          cat > "$RUNNER_TEMP/lambda-template-otel-smoke/NuGet.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$local_feed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local">
                <package pattern="Kralizek.Lambda.*" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="Amazon.*" />
                <package pattern="AWSSDK.*" />
                <package pattern="Microsoft.*" />
                <package pattern="OpenTelemetry.*" />
                <package pattern="Grpc.*" />
                <package pattern="Google.Protobuf" />
                <package pattern="System.*" />
                <package pattern="runtime.*" />
                <package pattern="NETStandard.Library" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF

      - name: Restore and build OpenTelemetry templates
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/lambda-template-otel-smoke"

          for project_name in SmokeOtelEvent SmokeOtelRequest; do
            project="$root/$project_name"
            dotnet restore "$project" \
              --configfile "$root/NuGet.config" \
              --packages "$root/packages"
            dotnet build "$project" \
              --configuration $CONFIGURATION \
              --no-restore \
              --warnaserror
          done
