name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        required: true
        default: minor
        options:
          - major
          - minor
          - patch
      release_channel:
        description: Release channel
        type: choice
        required: true
        default: stable
        options:
          - stable
          - alpha
          - beta
          - rc
      dry_run:
        description: Validate the selected release without publishing packages or creating a release
        type: boolean
        required: false
        default: false

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CONFIGURATION: Release
  ARTIFACTS_PATH: ./artifacts
  MinVerDefaultPreReleaseIdentifiers: preview

jobs:
  prepare-version:
    name: Prepare version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release-notes-start-tag: ${{ steps.version.outputs['release-notes-start-tag'] }}
      smoke-cache-key-suffix: ${{ steps.version.outputs.version }}

    steps:
      - name: Validate release source
        if: github.ref != 'refs/heads/master'
        run: |
          echo "Releases must be dispatched from master."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine minimum version
        id: minimum-version
        shell: bash
        run: |
          set -euo pipefail

          minimum_major_minor=$(sed -n 's:.*<MinVerMinimumMajorMinor>\([^<]*\)</MinVerMinimumMajorMinor>.*:\1:p' eng/Package.props | head -n 1)

          if [[ ! "$minimum_major_minor" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Could not determine MinVerMinimumMajorMinor from eng/Package.props."
            exit 1
          fi

          echo "version=${minimum_major_minor}.0" >> "$GITHUB_OUTPUT"

      - name: Calculate release version
        id: version
        uses: Kralizek/github-actions/actions/calculate-next-version@v0.4
        with:
          bump: ${{ inputs.bump }}
          channel: ${{ inputs.release_channel != 'stable' && inputs.release_channel || '' }}
          minimum-version: ${{ steps.minimum-version.outputs.version }}

  validate-and-pack:
    name: Validate and pack
    needs: prepare-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MinVerVersionOverride: ${{ needs.prepare-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration $CONFIGURATION --no-restore --warnaserror

      - name: Test
        run: dotnet test --configuration $CONFIGURATION --no-build --logger GitHubActions

      - name: Pack
        run: dotnet pack --configuration $CONFIGURATION --no-build --output $ARTIFACTS_PATH/packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ${{ env.ARTIFACTS_PATH }}/packages/*.nupkg
            ${{ env.ARTIFACTS_PATH }}/packages/*.snupkg
          if-no-files-found: error

  smoke-pack:
    name: Pack for template smoke tests
    needs: prepare-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MinVerVersionOverride: ${{ needs.prepare-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration $CONFIGURATION --no-restore --warnaserror

      - name: Pack locally
        run: dotnet pack --configuration $CONFIGURATION --no-build --output $ARTIFACTS_PATH/packages

      - name: Verify package versions
        shell: bash
        run: |
          set -euo pipefail

          versions_file=$(mktemp)

          for package in "$ARTIFACTS_PATH"/packages/Kralizek.Lambda.*.nupkg; do
            nuspec=$(unzip -p "$package" '*.nuspec')
            package_id=$(printf '%s\n' "$nuspec" | sed -n 's:.*<id>\(.*\)</id>.*:\1:p' | head -n 1)
            package_version=$(printf '%s\n' "$nuspec" | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' | head -n 1)

            if [ -z "$package_id" ] || [ -z "$package_version" ]; then
              echo "Could not read package metadata from $package"
              exit 1
            fi

            printf '%-45s %s\n' "$package_id" "$package_version"
            echo "$package_version" >> "$versions_file"
          done

          package_versions=$(sort -u "$versions_file")
          version_count=$(printf '%s\n' "$package_versions" | sed '/^$/d' | wc -l)

          if [ "$version_count" -ne 1 ]; then
            echo "Packed projects do not share the same package version:"
            printf '%s\n' "$package_versions"
            exit 1
          fi

          package_version=$(printf '%s\n' "$package_versions" | head -n 1)
          echo "$package_version" > "$ARTIFACTS_PATH/packages/package-version.txt"

      - name: Cache smoke-test packages
        uses: actions/cache@v5
        with:
          path: ${{ env.ARTIFACTS_PATH }}/packages
          key: smoke-packages-${{ runner.os }}-${{ github.sha }}-release-${{ needs.prepare-version.outputs.smoke-cache-key-suffix }}

  prepare-template-smoke-tests:
    name: Prepare template smoke tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine template smoke-test mode
        id: mode
        run: echo "mode=release" >> "$GITHUB_OUTPUT"

      - name: Read template smoke-test matrix
        shell: bash
        run: jq -c . .github/template-smoke-tests.json > "$RUNNER_TEMP/template-smoke-tests.source.json"

      - name: Validate template smoke-test matrix
        run: >-
          npx --yes ajv-cli@5.0.0 validate
          --spec=draft7
          --all-errors
          -s .github/template-smoke-tests.schema.json
          -d "$RUNNER_TEMP/template-smoke-tests.source.json"

      - name: Filter template smoke-test matrix
        env:
          SMOKE_TEST_MODE: ${{ steps.mode.outputs.mode }}
        shell: bash
        run: >-
          jq -ce --arg mode "$SMOKE_TEST_MODE"
          '{include: [.include[] | select(.when | index($mode))]}
          | if (.include | length) > 0 then . else error("No template smoke tests selected for mode: " + $mode) end'
          "$RUNNER_TEMP/template-smoke-tests.source.json"
          > "$RUNNER_TEMP/template-smoke-tests.json"

      - name: Export template smoke-test matrix
        id: matrix
        shell: bash
        run: echo "matrix=$(cat "$RUNNER_TEMP/template-smoke-tests.json")" >> "$GITHUB_OUTPUT"

  prepare-native-aot-samples:
    name: Prepare Native AOT samples
    needs: prepare-template-smoke-tests
    if: needs.prepare-template-smoke-tests.outputs.mode != 'pr'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Discover Native AOT samples
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY' > "$RUNNER_TEMP/native-aot-samples.json"
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          samples = []

          for project in sorted(Path("samples").glob("**/*.csproj")):
              root = ET.parse(project).getroot()
              publish_aot = any(
                  element.text is not None and element.text.strip().lower() == "true"
                  for element in root.iter()
                  if element.tag.endswith("PublishAot")
              )

              if publish_aot:
                  samples.append(
                      {
                          "projectName": project.stem,
                          "projectPath": project.as_posix(),
                      }
                  )

          if not samples:
              raise SystemExit("No Native AOT sample projects found under samples/**/*.csproj with <PublishAot>true</PublishAot>.")

          print(json.dumps({"include": samples}, separators=(",", ":")))
          PY

          echo "Discovered Native AOT samples:"
          cat "$RUNNER_TEMP/native-aot-samples.json"
          echo "matrix=$(cat "$RUNNER_TEMP/native-aot-samples.json")" >> "$GITHUB_OUTPUT"

  template-smoke-test:
    name: Template smoke test (${{ matrix.name }})
    needs: [prepare-version, smoke-pack, prepare-template-smoke-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-template-smoke-tests.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore smoke-test packages
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.ARTIFACTS_PATH }}/packages
          key: smoke-packages-${{ runner.os }}-${{ github.sha }}-release-${{ needs.prepare-version.outputs.smoke-cache-key-suffix }}
          fail-on-cache-miss: true

      - name: Read package metadata
        shell: bash
        run: |
          echo "PACKAGE_VERSION=$(cat "$ARTIFACTS_PATH/packages/package-version.txt")" >> "$GITHUB_ENV"
          echo "TEMPLATE_PACKAGE=$(ls "$ARTIFACTS_PATH"/packages/Kralizek.Lambda.Templates.*.nupkg)" >> "$GITHUB_ENV"

      - name: Install packaged templates
        run: |
          dotnet new install "$TEMPLATE_PACKAGE"
          dotnet new list "${{ matrix.shortName }}"

      - name: Instantiate ${{ matrix.name }} template
        env:
          TEMPLATE_AOT: ${{ matrix.aot || false }}
          TEMPLATE_OTEL: ${{ matrix.otel || false }}
          TEMPLATE_RAW: ${{ matrix.raw || false }}
          TEMPLATE_TENANT_ROUTING: ${{ matrix.tenantRouting || false }}
          TEMPLATE_MINIMAL: ${{ matrix.minimal || false }}
          TEMPLATE_VERSION: ${{ matrix.version || '' }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/lambda-template-smoke"

          args=()
          if [ "$TEMPLATE_AOT" = "true" ]; then
            args+=(--aot)
          fi
          if [ "$TEMPLATE_OTEL" = "true" ]; then
            args+=(--otel)
          fi
          if [ "$TEMPLATE_RAW" = "true" ]; then
            args+=(--raw)
          fi
          if [ "$TEMPLATE_TENANT_ROUTING" = "true" ]; then
            args+=(--tenant-routing)
          fi
          if [ "$TEMPLATE_MINIMAL" = "true" ]; then
            args+=(--minimal)
          fi
          if [ -n "$TEMPLATE_VERSION" ]; then
            args+=(--version "$TEMPLATE_VERSION")
          fi

          dotnet new "${{ matrix.shortName }}" \
            --name "${{ matrix.projectName }}" \
            --output "$RUNNER_TEMP/lambda-template-smoke/${{ matrix.projectName }}" \
            --profile SmokeProfile \
            --region eu-north-1 \
            --role SmokeRole \
            "${args[@]}"

      - name: Verify generated content
        env:
          MUST_EXIST: ${{ toJSON(matrix.mustExist) }}
          MUST_NOT_EXIST: ${{ toJSON(matrix.mustNotExist) }}
          MUST_MATCH: ${{ toJSON(matrix.mustMatch) }}
          MUST_NOT_MATCH: ${{ toJSON(matrix.mustNotMatch) }}
        shell: bash
        run: |
          set -euo pipefail

          project="$RUNNER_TEMP/lambda-template-smoke/${{ matrix.projectName }}"
          grep -q 'SmokeProfile' "$project/aws-lambda-tools-defaults.json"
          grep -q 'eu-north-1' "$project/aws-lambda-tools-defaults.json"
          grep -q 'SmokeRole' "$project/aws-lambda-tools-defaults.json"
          grep -q "Version=\"$PACKAGE_VERSION\"" "$project/${{ matrix.projectName }}.csproj"
          ! grep -R -q '__KRALIZEK_LAMBDA_VERSION__' "$project"

          while IFS= read -r file; do
            [ -z "$file" ] || test -e "$project/$file"
          done < <(jq -r '.[]?' <<< "$MUST_EXIST")

          while IFS= read -r file; do
            [ -z "$file" ] || test ! -e "$project/$file"
          done < <(jq -r '.[]?' <<< "$MUST_NOT_EXIST")

          while IFS= read -r pattern; do
            if [ -n "$pattern" ] && ! grep -R -E -q -- "$pattern" "$project"; then
              echo "Expected generated content to match regex: $pattern"
              exit 1
            fi
          done < <(jq -r '.[]?' <<< "$MUST_MATCH")

          while IFS= read -r pattern; do
            if [ -n "$pattern" ] && grep -R -E -q -- "$pattern" "$project"; then
              echo "Expected generated content not to match regex: $pattern"
              exit 1
            fi
          done < <(jq -r '.[]?' <<< "$MUST_NOT_MATCH")

      - name: Configure smoke-test package sources
        shell: bash
        run: |
          local_feed=$(realpath $ARTIFACTS_PATH/packages)
          cat > "$RUNNER_TEMP/lambda-template-smoke/NuGet.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$local_feed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local">
                <package pattern="Kralizek.Lambda.*" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF

      - name: Restore generated project
        run: >-
          dotnet restore
          "$RUNNER_TEMP/lambda-template-smoke/${{ matrix.projectName }}"
          --configfile "$RUNNER_TEMP/lambda-template-smoke/NuGet.config"
          --packages "$RUNNER_TEMP/lambda-template-smoke/packages"

      - name: Restore Native AOT runtime assets
        if: matrix.aot == true
        run: >-
          dotnet restore
          "$RUNNER_TEMP/lambda-template-smoke/${{ matrix.projectName }}"
          --runtime linux-x64
          --configfile "$RUNNER_TEMP/lambda-template-smoke/NuGet.config"
          --packages "$RUNNER_TEMP/lambda-template-smoke/packages"

      - name: Build generated project
        run: >-
          dotnet build
          "$RUNNER_TEMP/lambda-template-smoke/${{ matrix.projectName }}"
          --configuration $CONFIGURATION
          --no-restore
          --warnaserror

      - name: Publish Native AOT generated project
        if: matrix.aot == true
        run: >-
          dotnet publish
          "$RUNNER_TEMP/lambda-template-smoke/${{ matrix.projectName }}"
          --configuration $CONFIGURATION
          --runtime linux-x64
          --self-contained true
          --no-restore
          --warnaserror

  validate-native-aot-sample:
    name: Native AOT sample (${{ matrix.projectName }})
    needs: [prepare-version, prepare-template-smoke-tests, prepare-native-aot-samples]
    if: needs.prepare-template-smoke-tests.outputs.mode != 'pr' && needs.prepare-native-aot-samples.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MinVerVersionOverride: ${{ needs.prepare-version.outputs.version }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-native-aot-samples.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets

      - name: Restore Native AOT sample
        run: >-
          dotnet restore
          ${{ matrix.projectPath }}
          --runtime linux-x64

      - name: Build Native AOT sample
        run: >-
          dotnet build
          ${{ matrix.projectPath }}
          --configuration $CONFIGURATION
          --no-restore
          --warnaserror

      - name: Publish Native AOT sample
        run: >-
          dotnet publish
          ${{ matrix.projectPath }}
          --configuration $CONFIGURATION
          --runtime linux-x64
          --self-contained true
          --no-restore
          --warnaserror

  publish:
    name: Publish
    needs: [prepare-version, validate-and-pack, template-smoke-test, validate-native-aot-sample]
    if: needs.validate-native-aot-sample.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts/packages

      - name: Validate package version
        env:
          EXPECTED_VERSION: ${{ needs.prepare-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          package=$(ls ./artifacts/packages/Kralizek.Lambda.Templates.*.nupkg)
          nuspec=$(unzip -p "$package" '*.nuspec')
          package_version=$(printf '%s\n' "$nuspec" | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' | head -n 1)

          if [ "$package_version" != "$EXPECTED_VERSION" ]; then
            echo "Packed version $package_version does not match calculated release version $EXPECTED_VERSION."
            exit 1
          fi

      - name: Dry-run release summary
        if: inputs.dry_run
        run: |
          echo "Dry run: no packages or GitHub release will be published."
          echo "Version bump: ${{ inputs.bump }}"
          echo "Release channel: ${{ inputs.release_channel }}"
          echo "Version: ${{ needs.prepare-version.outputs.version }}"
          echo "Tag: ${{ needs.prepare-version.outputs.tag }}"
          echo "Release notes start tag: ${{ needs.prepare-version.outputs['release-notes-start-tag'] }}"

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-version.outputs.tag }}
          RELEASE_NOTES_START_TAG: ${{ needs.prepare-version.outputs['release-notes-start-tag'] }}
        shell: bash
        run: |
          set -euo pipefail

          args=("$RELEASE_TAG" --repo "${{ github.repository }}" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes)
          if [ "${{ inputs.release_channel }}" != "stable" ]; then
            args+=(--prerelease)
          fi
          if [[ -n "$RELEASE_NOTES_START_TAG" ]]; then
            args+=(--notes-start-tag "$RELEASE_NOTES_START_TAG")
          fi

          gh release create "${args[@]}"

      - name: Configure GitHub Packages source
        if: ${{ !inputs.dry_run }}
        run: >-
          dotnet nuget add source
          "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --name github
          --username "${{ github.actor }}"
          --password "${{ github.token }}"
          --store-password-in-clear-text

      - name: Publish to GitHub Packages
        if: ${{ !inputs.dry_run }}
        run: >-
          dotnet nuget push
          "./artifacts/packages/*.nupkg"
          --source github
          --api-key "${{ github.token }}"
          --skip-duplicate

      - name: Log in to NuGet.org
        if: ${{ !inputs.dry_run && inputs.release_channel != 'alpha' }}
        id: nuget-login
        uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: Kralizek

      - name: Publish to NuGet.org
        if: ${{ !inputs.dry_run && inputs.release_channel != 'alpha' }}
        run: >-
          dotnet nuget push
          "./artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Attach packages to GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-version.outputs.tag }}
        run: >-
          gh release upload "$RELEASE_TAG"
          ./artifacts/packages/*.nupkg
          ./artifacts/packages/*.snupkg
          --repo "${{ github.repository }}"
          --clobber

  benchmark-snapshot:
    name: Benchmark snapshot
    needs: [publish, prepare-version]
    if: needs.publish.result == 'success' && !inputs.dry_run
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release-benchmarks.yml
    with:
      release-mode: true
      release-tag: ${{ needs.prepare-version.outputs.tag }}
