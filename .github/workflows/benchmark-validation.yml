name: Benchmark validation

on:
  push:
    branches: [master]
    paths:
      - 'benchmarks/**'
  pull_request:
    paths:
      - 'benchmarks/**'
  workflow_dispatch:

concurrency:
  group: benchmark-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Run benchmarks
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-benchmarks.yml
    with:
      release-mode: false
