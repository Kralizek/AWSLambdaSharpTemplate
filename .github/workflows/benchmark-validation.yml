name: Benchmark validation

on:
  pull_request:
    paths:
      - 'benchmarks/**'
  workflow_dispatch:

concurrency:
  group: benchmark-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout benchmark source
        uses: actions/checkout@v6

      - name: Setup benchmark .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: benchmarks/global.json

      - name: Verify benchmark SDK
        working-directory: benchmarks
        run: test "$(dotnet --version)" = "10.0.400"

      - name: Build benchmark solution
        working-directory: benchmarks
        run: dotnet build Benchmarks.slnx --configuration Release --no-incremental -warnaserror
