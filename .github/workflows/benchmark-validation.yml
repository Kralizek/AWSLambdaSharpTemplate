name: Benchmark validation

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
  pull_request:
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
  workflow_dispatch:

concurrency:
  group: benchmark-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build benchmark solution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore benchmarks/Benchmarks.slnx

      - name: Build
        run: dotnet build benchmarks/Benchmarks.slnx --configuration Release --no-restore
