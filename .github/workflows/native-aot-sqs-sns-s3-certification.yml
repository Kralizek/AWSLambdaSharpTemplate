name: Native AOT SQS SNS S3 certification

on:
  pull_request:
    paths:
      - 'samples/NativeAotSqsSnsS3Function/**'
      - '.github/workflows/native-aot-sqs-sns-s3-certification.yml'

jobs:
  publish:
    name: Publish NativeAotSqsSnsS3Function
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets

      - name: Restore Native AOT sample
        run: >-
          dotnet restore
          samples/NativeAotSqsSnsS3Function/NativeAotSqsSnsS3Function.csproj
          --runtime linux-x64

      - name: Build Native AOT sample
        run: >-
          dotnet build
          samples/NativeAotSqsSnsS3Function/NativeAotSqsSnsS3Function.csproj
          --configuration Release
          --no-restore
          --warnaserror

      - name: Publish Native AOT sample
        run: >-
          dotnet publish
          samples/NativeAotSqsSnsS3Function/NativeAotSqsSnsS3Function.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --no-restore
          --warnaserror
