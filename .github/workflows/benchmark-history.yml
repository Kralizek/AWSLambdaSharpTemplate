name: Benchmark history

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile to run
        type: choice
        required: true
        default: ci
        options:
          - ci
          - full
          - stress
      publish_history:
        description: Publish results to benchmark history
        type: boolean
        required: false
        default: false

concurrency:
  group: benchmark-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Run benchmarks
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release-benchmarks.yml
    with:
      benchmark-profile: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'ci' }}
      publish-history: ${{ github.event_name == 'push' || inputs.publish_history }}
      release-mode: false
