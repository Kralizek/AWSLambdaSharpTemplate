name: Benchmark history

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: benchmark-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Run and publish benchmarks
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release-benchmarks.yml
    with:
      publish-history: true
      release-mode: false
