name: Benchmark snapshot

on:
  workflow_call:
    inputs:
      publish-history:
        description: Publish benchmark history to the configured results branch
        required: false
        type: boolean
        default: false
      release-mode:
        description: Attach the benchmark snapshot to an existing GitHub release
        required: false
        type: boolean
        default: false
      release-tag:
        description: GitHub release tag used when release mode is enabled
        required: false
        type: string
        default: ''
  workflow_dispatch:

jobs:
  snapshot:
    name: Collect benchmarks
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout benchmark source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup benchmark .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: benchmarks/global.json

      - name: Run benchmarks
        working-directory: benchmarks
        run: >-
          dotnet run
          --project Benchmarks/Benchmarks.csproj
          --configuration Release
          --
          --filter '*'
          --exporters json
          --artifacts "$RUNNER_TEMP/BenchmarkDotNet.Artifacts"

      - name: Upload BenchmarkDotNet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.run_id }}
          path: ${{ runner.temp }}/BenchmarkDotNet.Artifacts
          if-no-files-found: error

  publish-history:
    name: Publish benchmark history
    if: inputs.publish-history == true
    needs: snapshot
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download BenchmarkDotNet artifacts
        uses: actions/download-artifact@v8
        with:
          name: benchmark-results-${{ github.run_id }}
          path: ${{ runner.temp }}/BenchmarkDotNet.Artifacts

      - name: Publish benchmark history
        uses: martincostello/benchmarkdotnet-results-publisher@b8fe7bb9691c4fdcda7dee630aa09493e81004b8 # v2
        with:
          branch: benchmark-history
          results-path: ${{ runner.temp }}/BenchmarkDotNet.Artifacts

  attach:
    name: Attach benchmark snapshot
    if: inputs.release-mode == true
    needs: snapshot
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download BenchmarkDotNet artifacts
        uses: actions/download-artifact@v8
        with:
          name: benchmark-results-${{ github.run_id }}
          path: ${{ runner.temp }}/BenchmarkDotNet.Artifacts

      - name: Package benchmark snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          zip -r benchmark-results.zip BenchmarkDotNet.Artifacts

      - name: Attach benchmark snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_TAG" ]; then
            echo "Release mode requires a release tag."
            exit 1
          fi

          if ! gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "No GitHub release exists for $RELEASE_TAG; keeping the benchmark snapshot as a workflow artifact."
            exit 0
          fi

          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/benchmark-results.zip" \
            --repo "${{ github.repository }}" \
            --clobber
