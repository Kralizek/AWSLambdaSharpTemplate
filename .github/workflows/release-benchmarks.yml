name: Benchmark snapshot

on:
  workflow_call:
    inputs:
      release-mode:
        description: Publish benchmark history for release runs
        required: false
        type: boolean
        default: false
      release-tag:
        description: GitHub release tag retained for caller compatibility
        required: false
        type: string
        default: ''
  workflow_dispatch:

jobs:
  snapshot:
    name: Collect benchmarks
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout benchmark source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup benchmark .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: benchmarks/global.json

      - name: Run benchmarks
        working-directory: benchmarks
        run: >-
          dotnet run
          --project Benchmarks/Benchmarks.csproj
          --configuration Release
          --
          --filter '*'
          --exporters json
          --artifacts "$RUNNER_TEMP/BenchmarkDotNet.Artifacts"

      - name: Upload BenchmarkDotNet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.run_id }}
          path: ${{ runner.temp }}/BenchmarkDotNet.Artifacts
          if-no-files-found: error

      - name: Publish benchmark history
        if: inputs.release-mode == true
        uses: martincostello/benchmarkdotnet-results-publisher@b8fe7bb9691c4fdcda7dee630aa09493e81004b8 # v2
        with:
          results-path: ${{ runner.temp }}/BenchmarkDotNet.Artifacts
